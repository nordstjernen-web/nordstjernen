name: macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler }} on macos-${{ matrix.macos }}
    runs-on: macos-${{ matrix.macos }}
    timeout-minutes: 45

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'

    strategy:
      fail-fast: false
      matrix:
        macos: ['14']
        compiler: [clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies (Homebrew)
        run: |
          brew install meson ninja pkg-config cmake gtk4 curl ccache \
              uchardet librsvg libpsl sqlite dylibbundler

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.macos }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.macos }}-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats

      - name: Show toolchain versions
        run: |
          clang --version
          ccache --version | head -1
          meson --version
          ninja --version
          pkg-config --modversion gtk4
          pkg-config --modversion libcurl

      - name: Build
        id: build
        if: hashFiles('meson.build') != ''
        shell: bash
        run: |
          set -o pipefail
          export CC="ccache clang"
          meson setup builddir --werror 2>&1 | tee build.log
          meson compile -C builddir 2>&1 | tee -a build.log

      - name: Publish build log on failure
        if: failure() && hashFiles('build.log') != ''
        shell: bash
        run: |
          {
            echo '## macOS build log (last 200 lines)'
            echo
            echo '```'
            tail -200 build.log
            echo '```'
            if [ -f builddir/meson-logs/meson-log.txt ]; then
              echo
              echo '## meson-log.txt (last 200 lines)'
              echo
              echo '```'
              tail -200 builddir/meson-logs/meson-log.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test (binary present and executable)
        if: hashFiles('builddir/src/nordstjernen') != ''
        run: |
          test -x builddir/src/nordstjernen
          file builddir/src/nordstjernen
          otool -L builddir/src/nordstjernen | head -20

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-log-macos-${{ matrix.macos }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload nordstjernen binary
        if: hashFiles('builddir/src/nordstjernen') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nordstjernen-macos-${{ matrix.macos }}
          path: builddir/src/nordstjernen
          if-no-files-found: error
          retention-days: 14

      - name: Build .app bundle and .dmg
        id: pack
        if: hashFiles('builddir/src/nordstjernen') != ''
        continue-on-error: true
        env:
          BUILDDIR: ${{ github.workspace }}/builddir
        run: |
          set -o pipefail
          bash -x ./scripts/pack-macos.sh 2>&1 | tee pack-macos.log

      - name: Publish pack-macos log on failure
        if: always() && hashFiles('pack-macos.log') != ''
        run: |
          {
            echo '## pack-macos.sh log (last 300 lines)'
            echo
            echo '```'
            tail -300 pack-macos.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pack-macos log
        if: always() && hashFiles('pack-macos.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: pack-macos-log-${{ matrix.macos }}
          path: pack-macos.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload .dmg
        if: hashFiles('dist/nordstjernen-*-macos-*.dmg') != ''
        uses: actions/upload-artifact@v7
        with:
          name: nordstjernen-macos-${{ matrix.macos }}-dmg
          path: dist/nordstjernen-*-macos-*.dmg
          if-no-files-found: ignore
          retention-days: 14
