name: netbsd

# BSD builds run in a VM nested inside the Linux runner (vmactions), which is
# slow, so they are dispatch-only (the nightly orchestrator drives them) rather
# than on every push/PR.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: netbsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: gcc on NetBSD
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # meson fetches subprojects/ns-pango with git at setup time, and the BSD
      # VMs have no network-facing git configured for it. Materialise it here,
      # on the runner, where the checkout already happened; vmactions copies the
      # workspace into the VM, and meson uses an existing subproject directory
      # as-is.
      - name: Fetch the ns-pango subproject on the host
        run: |
          set -e
          url=$(sed -n 's/^ *url *= *//p' subprojects/ns-pango.wrap)
          rev=$(sed -n 's/^ *revision *= *//p' subprojects/ns-pango.wrap)
          git clone --quiet --filter=blob:none --no-checkout "$url" subprojects/ns-pango
          git -C subprojects/ns-pango checkout --quiet --detach "$rev"
          git -C subprojects/ns-pango rev-parse HEAD

      - name: Build, smoke and pack in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.0'
          usesh: true
          copyback: true
          prepare: |
            if [ ! -f /usr/X11R7/lib/pkgconfig/x11.pc ]; then
              base=https://cdn.netbsd.org/pub/NetBSD/NetBSD-10.0/amd64/binary/sets
              for s in xbase xcomp; do
                ftp -o "/tmp/$s.tar.xz" "$base/$s.tar.xz"
                tar -C / -xJpf "/tmp/$s.tar.xz"
              done
            fi
            # pkg_add's built-in default reaches ftp.netbsd.org over plain
            # HTTP, and that host has refused connections outright, failing
            # the job before a compiler ever ran. The CDN serves the same
            # tree over TLS and is where the sets above come from; name both,
            # CDN first, so one host being down is no longer fatal.
            arch=$(uname -p)
            rel=$(uname -r | cut -d. -f1,2)
            pkgdir="pub/pkgsrc/packages/NetBSD/$arch/$rel/All"
            PKG_PATH="https://cdn.netbsd.org/$pkgdir;http://ftp.netbsd.org/$pkgdir"
            export PKG_PATH
            echo "PKG_PATH=$PKG_PATH"
            attempt=0
            until /usr/sbin/pkg_add -U \
                meson ninja-build pkgconf bash zip ccache git-base \
                gtk4 curl openssl uchardet sqlite3 libwebp libavif libpsl SDL2
            do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "pkg_add failed $attempt times; no pkgsrc mirror in" \
                     "PKG_PATH is reachable from the VM. This is a mirror" \
                     "outage, not a build failure."
                exit 1
              fi
              echo "pkg_add attempt $attempt failed; retrying"
              sleep $((attempt * 20))
            done
            # pkgsrc splits glib's python-dependent tools out of glib2, and
            # gtk4 does not pull them in. ns-pango's meson run needs
            # glib-mkenums, which glib2-tools provides; keep it on its own
            # pkg_add so a miss here cannot take the line above with it.
            /usr/sbin/pkg_add -U glib2-tools || true
          run: |
            set -e
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            # pkgsrc must precede the X11R7 base sets: X11R7 ships an old
            # pixman-1.pc (0.38.4) that would shadow the newer pkgsrc pixman
            # and break cairo's 'pixman-1 >= 0.40.0' requirement.
            export PKG_CONFIG_PATH="/usr/pkg/lib/pkgconfig:/usr/X11R7/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export CC="ccache cc"
            export CXX="ccache c++"
            # ns-pango's meson run resolves glib-mkenums through glib-2.0's
            # pkg-config tool variable and hard-errors when the file behind it
            # is missing, so fall back to the system Pango rather than fail the
            # build if glib2-tools did not install.
            pango_arg=
            if [ ! -x /usr/pkg/bin/glib-mkenums ]; then
              echo "glib-mkenums missing: building against the system Pango"
              pango_arg=-Dns-pango=disabled
            fi
            # WAMR's posix platform layer uses MAP_32BIT, which NetBSD does
            # not provide, so the WebAssembly engine is disabled here.
            meson setup builddir --buildtype=release -Db_ndebug=true \
              -Dwasm=disabled $pango_arg
            meson compile -C builddir
            if ./builddir/src/gtk/nordstjernen --headless --dump=text about:start > about.txt 2>/dev/null \
               && grep -q Nordstjernen about.txt; then
              echo "headless smoke: ok"
            else
              echo "headless smoke: skipped"
            fi
            bash ./scripts/pack-bsd.sh netbsd
            ls -l dist/*-netbsd-x86_64.zip
            rm -rf builddir

      - name: Upload NetBSD portable zip
        if: hashFiles('dist/*-netbsd-x86_64.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nordstjernen-netbsd-x86_64
          path: dist/*-netbsd-x86_64.zip
          if-no-files-found: error
          retention-days: 14
