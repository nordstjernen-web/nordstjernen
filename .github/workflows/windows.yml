name: windows

on:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: msys2/mingw64 on windows-${{ matrix.windows }}
    runs-on: windows-${{ matrix.windows }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        windows: ['2022']

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            base-devel
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gumbo-parser
            mingw-w64-x86_64-libvpx

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: D:\a\_temp\msys64\home\runneradmin\.ccache
          key: ccache-windows-${{ matrix.windows }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.windows }}-

      - name: Configure ccache
        run: |
          ccache --max-size=200M
          ccache --zero-stats

      - name: Show toolchain versions
        run: |
          clang --version
          ccache --version | head -1
          meson --version
          ninja --version
          pkg-config --modversion gtk4
          pkg-config --modversion libcurl

      - name: Build
        id: build
        if: hashFiles('meson.build') != ''
        run: |
          set -o pipefail
          export CC="ccache clang"
          meson setup builddir --werror
          meson compile -C builddir 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Smoke test (binary present)
        if: hashFiles('builddir/src/nordstjernen.exe') != ''
        run: |
          test -f builddir/src/nordstjernen.exe
          file builddir/src/nordstjernen.exe

      - name: Headless smoke (--print-config + about:nordstjernen)
        if: hashFiles('builddir/src/nordstjernen.exe') != ''
        run: |
          set -o pipefail
          ./builddir/src/nordstjernen.exe --print-config | head -5
          ./builddir/src/nordstjernen.exe --headless --dump=text about:nordstjernen | head -3

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-${{ matrix.windows }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload nordstjernen binary
        if: hashFiles('builddir/src/nordstjernen.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nordstjernen-windows-${{ matrix.windows }}
          path: builddir/src/nordstjernen.exe
          if-no-files-found: error
          retention-days: 14
