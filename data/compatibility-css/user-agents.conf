# Per-site user-agent overrides for the compatibility framework.
#
# Keys must match a rule id registered in src/compatibility.c.
# An empty or missing value means: send the default User-Agent.

[user-agents]

# Reddit blocks the default UA behind a JS wall; pretend to be Firefox.
reddit = Mozilla/5.0 (X11; Linux x86_64; rv:122.0) Gecko/20100101 Firefox/122.0

# Google's frontends serve a JS-required interstitial to unrecognized UAs.
# Pretending to be a recent Firefox unlocks the no-JS HTML fallback.
google = Mozilla/5.0 (X11; Linux x86_64; rv:122.0) Gecko/20100101 Firefox/122.0
gmail = Mozilla/5.0 (X11; Linux x86_64; rv:122.0) Gecko/20100101 Firefox/122.0
accounts = Mozilla/5.0 (X11; Linux x86_64; rv:122.0) Gecko/20100101 Firefox/122.0
duckduckgo =
wikipedia =
aftenposten =
