          font-size="184"
          font-weight="bold"
          fill="url(#nfill)"
          opacity="0.95">N</text>
    <circle cx="128" cy="128" r="86" fill="url(#halo)"/>
    <polygon points="128,18 138,118 238,128 138,138 128,238 118,138 18,128 118,118"
