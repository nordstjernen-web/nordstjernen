  <rect width="88" height="31" fill="url(#frame)"/>
  <rect x="2" y="2" width="84" height="27" fill="#0a1830"/>
  <rect x="3" y="3" width="82" height="25" fill="url(#bg)"/>

  <svg x="3" y="3" width="25" height="25" viewBox="0 0 256 256">
    <text x="128" y="196"
