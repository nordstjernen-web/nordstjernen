  <g font-family="Verdana,Geneva,sans-serif" font-weight="bold" text-anchor="middle">
    <text x="57" y="13" font-size="6" fill="#ffffff" letter-spacing="0.2">BEST VIEWED IN</text>
    <text x="57" y="25" font-size="7" fill="#ffd34d" letter-spacing="0.1">NORDSTJERNEN</text>
