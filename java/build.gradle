plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
}

group = 'org.nordstjernen'

// pom.xml is the single source of truth for the released version: the Maven
// build ships it, and this build reads it back so the two never drift.
version = new groovy.xml.XmlSlurper().parse(file('pom.xml')).version.text()

// The official Java browser: a Swing shell over the renderer process.
//   ./gradlew run --args="https://example.com"
// Point at the renderer with -Dnordstjernen.renderer=… or NORDSTJERNEN_RENDERER.
application {
    mainClass = 'org.nordstjernen.app.Browser'
}

// Browser.resolveVersion() reads this resource when running outside a packaged
// jar (e.g. ./gradlew run). Maven produces the same file by filtering
// src/main/resources-filtered/.
def generateVersionProperties = tasks.register('generateVersionProperties') {
    def outDir = layout.buildDirectory.dir('generated/version')
    def projectVersion = version
    inputs.property('version', projectVersion)
    outputs.dir(outDir)
    doLast {
        def f = outDir.get().file('org/nordstjernen/app/version.properties').asFile
        f.parentFile.mkdirs()
        f.text = "version=${projectVersion}\n"
    }
}

sourceSets {
    main {
        resources {
            srcDir generateVersionProperties
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Native libraries staged by scripts/build-native.sh land in
// src/main/resources/native/<os>-<arch>/ and are bundled into the jar.

tasks.named('jar') {
    manifest {
        attributes(
            'Automatic-Module-Name': 'org.nordstjernen',
            // Grant native access so the JNI load doesn't warn on JDK 24+
            // (and stays usable when that restriction is enforced).
            'Enable-Native-Access': 'ALL-UNNAMED',
            // Make the jar runnable as the browser (java -jar …), matching
            // the nightly fat jar.
            'Main-Class': 'org.nordstjernen.app.Browser',
            // Surfaces in the window title as "(Java <version>)".
            'Implementation-Title': 'Nordstjernen',
            'Implementation-Version': version,
        )
    }
}

// gradle publishToMavenLocal / publish — the POM mirrors java/pom.xml so a
// consumer sees the same metadata whichever build produced the artifact.
publishing {
    publications {
        library(MavenPublication) {
            from components.java
            artifactId = 'nordstjernen-java'
            pom {
                name = 'Nordstjernen for Java'
                description = 'A web browser for the JVM, and the embedding ' +
                    'library it is built on: fetch, lay out, script and render ' +
                    'web pages with the Nordstjernen engine, either in-process ' +
                    'over JNI or in a separate renderer process.'
                url = 'https://nordstjernen.org'
                inceptionYear = '2026'
                organization {
                    name = 'Nordstjernen'
                    url = 'https://nordstjernen.org'
                }
                licenses {
                    license {
                        name = 'Nordstjernen Source License v1.0'
                        url = 'https://raw.githubusercontent.com/nordstjernen-web/nordstjernen/main/License.md'
                        distribution = 'repo'
                        comments = 'LicenseRef-NSL-1.0'
                    }
                }
                developers {
                    developer {
                        name = 'Andreas Røsdal'
                        url = 'https://nordstjernen.org'
                        organization = 'Nordstjernen'
                        organizationUrl = 'https://nordstjernen.org'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/nordstjernen-web/nordstjernen.git'
                    developerConnection = 'scm:git:ssh://git@github.com/nordstjernen-web/nordstjernen.git'
                    url = 'https://github.com/nordstjernen-web/nordstjernen'
                }
                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/nordstjernen-web/nordstjernen/issues'
                }
            }
        }
    }
}
